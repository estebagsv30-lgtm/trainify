<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trainify – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #888;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      z-index: 0;
    }
    .blob-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px; }
    .blob-2 { width: 300px; height: 300px; background: var(--accent2); bottom: -50px; left: -100px; }

    .container {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      padding: 16px;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 3.5rem;
      letter-spacing: 4px;
      color: var(--accent);
      text-align: center;
      margin-bottom: 4px;
      animation: fadeDown 0.6s ease both;
    }
    .tagline {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 40px;
      animation: fadeDown 0.6s 0.1s ease both;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }
    .tab {
      flex: 1; padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      transition: all 0.2s;
      font-family: var(--font-body);
      border: none; background: none;
    }
    .tab.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .msg { font-size: 0.82rem; text-align: center; margin-top: 14px; min-height: 20px; }
    .msg.error { color: #ff6b6b; }
    .msg.success { color: var(--accent); }

    .panel { display: none; }
    .panel.active { display: block; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="container">
    <div class="logo">TRAINIFY</div>
    <div class="tagline">Tu entrenamiento, tu progreso</div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
        <button class="tab" onclick="switchTab('register')">Registrarse</button>
      </div>

      <!-- LOGIN -->
      <div id="panel-login" class="panel active">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="login-email" placeholder="tu@email.com"/>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="••••••••"/>
        </div>
        <button class="btn" onclick="doLogin()">Entrar</button>
        <div id="login-msg" class="msg"></div>
      </div>

      <!-- REGISTRO -->
      <div id="panel-register" class="panel">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="reg-name" placeholder="Tu nombre"/>
        </div>
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="reg-email" placeholder="tu@email.com"/>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"/>
        </div>
        <button class="btn" onclick="doRegister()">Crear cuenta</button>
        <div id="reg-msg" class="msg"></div>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
      document.getElementById('panel-login').classList.toggle('active', tab==='login');
      document.getElementById('panel-register').classList.toggle('active', tab==='register');
    }

    function getUsers() { return JSON.parse(localStorage.getItem('trainify_users') || '[]'); }
    function saveUsers(u) { localStorage.setItem('trainify_users', JSON.stringify(u)); }

    function doLogin() {
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      const msg   = document.getElementById('login-msg');
      const users = getUsers();
      const user  = users.find(u => u.email === email && u.password === pass);
      if (!user) { msg.className='msg error'; msg.textContent='Correo o contraseña incorrectos.'; return; }
      localStorage.setItem('trainify_session', JSON.stringify(user));
      window.location.href = 'dashboard.html';
    }

    function doRegister() {
      const name  = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass  = document.getElementById('reg-pass').value;
      const msg   = document.getElementById('reg-msg');
      if (!name || !email || !pass) { msg.className='msg error'; msg.textContent='Rellena todos los campos.'; return; }
      if (pass.length < 6) { msg.className='msg error'; msg.textContent='La contraseña debe tener al menos 6 caracteres.'; return; }
      const users = getUsers();
      if (users.find(u => u.email === email)) { msg.className='msg error'; msg.textContent='Este correo ya está registrado.'; return; }
      users.push({ id: Date.now(), name, email, password: pass });
      saveUsers(users);
      msg.className='msg success'; msg.textContent='¡Cuenta creada! Inicia sesión.';
      setTimeout(() => switchTab('login'), 1200);
    }

    // Si ya hay sesión activa, redirigir
    if (localStorage.getItem('trainify_session')) window.location.href = 'dashboard.html';
  </script>
</body>
</html>
